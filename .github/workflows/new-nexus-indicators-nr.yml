name: Novos indicadores NR — Squeeze e Pullback
on:
  push:
    paths:
      - '03_projetos_proprios/Nexus_Volatility_Squeeze/**'
      - '03_projetos_proprios/Nexus_EMA_Trend_Pullback/**'
      - '.github/workflows/new-nexus-indicators-nr.yml'
  pull_request:
    paths:
      - '03_projetos_proprios/Nexus_Volatility_Squeeze/**'
      - '03_projetos_proprios/Nexus_EMA_Trend_Pullback/**'
      - '.github/workflows/new-nexus-indicators-nr.yml'
jobs:
  closed-bar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar Squeeze, Pullback e invariancia do historico
        run: |
          python -m unittest discover -s 03_projetos_proprios/Nexus_Volatility_Squeeze/tests -v
          python -m unittest discover -s 03_projetos_proprios/Nexus_EMA_Trend_Pullback/tests -v
