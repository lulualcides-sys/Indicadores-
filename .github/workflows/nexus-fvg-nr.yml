name: Nexus FVG NR — testes causais
on:
  push:
    paths:
      - '03_projetos_proprios/Nexus_FVG_Retest/**'
      - '.github/workflows/nexus-fvg-nr.yml'
  pull_request:
    paths:
      - '03_projetos_proprios/Nexus_FVG_Retest/**'
      - '.github/workflows/nexus-fvg-nr.yml'
jobs:
  fvg-causal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes focados FVG
        run: python -m unittest discover -s 03_projetos_proprios/Nexus_FVG_Retest/tests -p 'test_*.py' -v
