name: Curadoria Telegram — validar catálogo
on:
  push:
    paths:
      - '09_pesquisa_telegram/**'
      - '.github/workflows/telegram-indicators-catalog.yml'
  pull_request:
    paths:
      - '09_pesquisa_telegram/**'
      - '.github/workflows/telegram-indicators-catalog.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s 09_pesquisa_telegram/tests -p 'test_*.py' -v
