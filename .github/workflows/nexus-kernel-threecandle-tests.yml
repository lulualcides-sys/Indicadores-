name: Kernel e Three Candle NR — testes causais
on:
  push:
    paths:
      - '03_projetos_proprios/Nexus_Causal_Kernel/**'
      - '03_projetos_proprios/Nexus_Three_Candle/**'
      - '.github/workflows/nexus-kernel-threecandle-tests.yml'
  pull_request:
    paths:
      - '03_projetos_proprios/Nexus_Causal_Kernel/**'
      - '03_projetos_proprios/Nexus_Three_Candle/**'
      - '.github/workflows/nexus-kernel-threecandle-tests.yml'
jobs:
  causal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar kernel unilateral, 3 candles e prefixos causais
        run: |
          python -m unittest discover -s 03_projetos_proprios/Nexus_Causal_Kernel/tests -p 'test_*.py' -v
          python -m unittest discover -s 03_projetos_proprios/Nexus_Three_Candle/tests -p 'test_*.py' -v
