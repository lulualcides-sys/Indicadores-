name: Nexus Session VWAP NR — testes
on:
  push:
    paths:
      - '03_projetos_proprios/Nexus_Session_VWAP/**'
      - '.github/workflows/nexus-vwap-nr.yml'
  pull_request:
    paths:
      - '03_projetos_proprios/Nexus_Session_VWAP/**'
      - '.github/workflows/nexus-vwap-nr.yml'
jobs:
  vwap-closed-bars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s 03_projetos_proprios/Nexus_Session_VWAP/tests -p 'test_*.py' -v
